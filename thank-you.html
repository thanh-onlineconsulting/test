<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thank You - Design Free Design Elite</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f5f5f5;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        .top-nav {
            background-color: #7B5B8E;
            padding: 12px 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .nav-brand {
            color: white;
            font-size: 18px;
            font-weight: 600;
            text-decoration: none;
        }

        .nav-link {
            color: white;
            text-decoration: none;
            font-size: 14px;
            font-weight: 500;
        }

        .thanks {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 40px 20px;
        }

        .thanks-icon {
            font-size: 64px;
            margin-bottom: 20px;
        }

        .thanks-title {
            font-size: 36px;
            color: #3d2a4d;
            margin-bottom: 12px;
        }

        .thanks-text {
            font-size: 15px;
            color: #666;
            max-width: 480px;
            line-height: 1.6;
            margin-bottom: 30px;
        }

        .home-btn {
            display: inline-block;
            background-color: #7B5B8E;
            color: white;
            text-decoration: none;
            padding: 12px 32px;
            border-radius: 4px;
            font-size: 14px;
            font-weight: 600;
        }

        .home-btn:hover {
            background-color: #5a3f6b;
        }
    </style>
</head>
<body>
    <div class="top-nav">
        <a href="/" class="nav-brand">Design Free Design Elite</a>
        <a href="/" class="nav-link">Home</a>
    </div>

    <div class="thanks">
        <div class="thanks-icon">✉</div>
        <h1 class="thanks-title">Thanks for reaching out!</h1>
        <p class="thanks-text">Your message has been received. We'll get back to you as soon as possible.</p>
        <a href="/" class="home-btn">Back to Home</a>
    </div>
</body>
</html>
