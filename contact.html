<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Us</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #f3f1f7;
            color: #333;
        }

        .page-wrapper {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 40px 20px;
        }

        .contact-card {
            width: 100%;
            max-width: 640px;
            background: white;
            border-radius: 20px;
            box-shadow: 0 18px 40px rgba(78, 57, 123, 0.12);
            overflow: hidden;
        }

        .contact-header {
            background: linear-gradient(135deg, #7B5B8E 0%, #C06CC6 100%);
            color: white;
            padding: 40px 30px;
            text-align: center;
        }

        .contact-header h1 {
            font-size: 32px;
            margin-bottom: 10px;
        }

        .contact-header p {
            font-size: 15px;
            opacity: 0.9;
            line-height: 1.6;
        }

        .contact-form {
            padding: 35px 30px;
        }

        .form-group {
            display: flex;
            flex-wrap: wrap;
            gap: 20px;
            margin-bottom: 20px;
        }

        .form-group .field {
            flex: 1 1 220px;
            min-width: 220px;
        }

        .form-group label {
            display: block;
            font-size: 13px;
            margin-bottom: 8px;
            color: #555;
        }

        .form-group input,
        .form-group textarea {
            width: 100%;
            padding: 14px 16px;
            border: 1px solid #ddd;
            border-radius: 12px;
            font-size: 15px;
            background: #faf8ff;
            transition: border-color 0.2s, box-shadow 0.2s;
        }

        .form-group input:focus,
        .form-group textarea:focus {
            outline: none;
            border-color: #7B5B8E;
            box-shadow: 0 0 0 4px rgba(123, 91, 142, 0.12);
        }

        .form-group textarea {
            min-height: 160px;
            resize: vertical;
        }

        .submit-row {
            text-align: right;
        }

        .submit-button {
            background-color: #7B5B8E;
            color: white;
            border: none;
            padding: 14px 32px;
            border-radius: 999px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.25s, transform 0.25s;
        }

        .submit-button:hover {
            background-color: #6a4f7a;
            transform: translateY(-1px);
        }

        .note {
            margin-top: 20px;
            font-size: 13px;
            color: #6d6a7a;
            line-height: 1.6;
        }

        @media (max-width: 600px) {
            .contact-header h1 {
                font-size: 28px;
            }

            .form-group {
                gap: 12px;
            }

            .submit-row {
                text-align: center;
            }
        }
    </style>
</head>
<body>
    <div class="page-wrapper">
        <div class="contact-card">
            <div class="contact-header">
                <h1>Contact Us</h1>
                <p>Have a question or need assistance? Send us a message and we'll get back to you soon.</p>
            </div>
            <form class="contact-form">
                <div class="form-group">
                    <div class="field">
                        <label for="first-name">First Name</label>
                        <input type="text" id="first-name" name="first-name" placeholder="Enter your first name" required>
                    </div>
                    <div class="field">
                        <label for="last-name">Last Name</label>
                        <input type="text" id="last-name" name="last-name" placeholder="Enter your last name" required>
                    </div>
                </div>
                <div class="form-group">
                    <div class="field" style="flex: 1 1 100%;">
                        <label for="email">Email</label>
                        <input type="email" id="email" name="email" placeholder="Enter your email address" required>
                    </div>
                </div>
                <div class="form-group">
                    <div class="field" style="flex: 1 1 100%;">
                        <label for="message">Message</label>
                        <textarea id="message" name="message" placeholder="Write your message here" required></textarea>
                    </div>
                </div>
                <div class="submit-row">
                    <button type="submit" class="submit-button">Send Message</button>
                </div>
                <p class="note">We respect your privacy. Your information will only be used to respond to your inquiry.</p>
            </form>
        </div>
    </div>
</body>
</html>
